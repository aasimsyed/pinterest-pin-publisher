name = "pinterest-pin-publisher"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Runs every 15 minutes. Adjust to match how precise you want publish times
# to be -- every 15 min means a pin scheduled for 09:00 could go out
# anywhere between 09:00 and 09:14.
[triggers]
crons = ["*/15 * * * *"]

# Create this once with: wrangler d1 create pin-publisher-db
# Then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "pin-publisher-db"
database_id = "e259f6d1-7847-4b48-a78d-1e0465f3117d"
migrations_dir = "migrations"

# Pin PNGs in ./images are uploaded on wrangler deploy. The Worker reads them
# here so it never has to fetch WordPress (the host blocks Cloudflare IPs).
[assets]
directory = "./images"
binding = "ASSETS"
run_worker_first = true

# Non-secret flags. Production is the default. Set PINTEREST_SANDBOX = "true"
# to call api-sandbox.pinterest.com instead (Trial apps can create pins there).
# Sandbox tokens and board IDs are not interchangeable with production.
# After flipping this, re-run oauth_setup.py --sandbox, put the new refresh
# token, set PINTEREST_BOARD_ID to a sandbox board, clear oauth_tokens, deploy.
[vars]
PINTEREST_SANDBOX = "true"
# Production board (restore this when you switch sandbox off):
# PINTEREST_BOARD_ID = "1097471071636272511"
PINTEREST_BOARD_ID = "660692276524863179"

# Secrets (never put these in this file: set them with `wrangler secret put`):
#   wrangler secret put PINTEREST_CLIENT_ID
#   wrangler secret put PINTEREST_CLIENT_SECRET
#   wrangler secret put PINTEREST_REFRESH_TOKEN
#   wrangler secret put MANUAL_TRIGGER_SECRET
