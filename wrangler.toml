name = "pinterest-pin-publisher"
main = "src/worker.js"
compatibility_date = "2026-07-01"

# Runs every 15 minutes. Adjust to match how precise you want publish times
# to be -- every 15 min means a pin scheduled for 09:00 could go out
# anywhere between 09:00 and 09:14.
[triggers]
crons = ["*/15 * * * *"]

# Create this once with: wrangler d1 create pin-publisher-db
# Then paste the database_id it prints below.
[[d1_databases]]
binding = "DB"
database_name = "pin-publisher-db"
database_id = "e259f6d1-7847-4b48-a78d-1e0465f3117d"
migrations_dir = "migrations"

# Non-secret flags, managed by scripts/setup.py. Trial Pinterest apps can
# only create pins in Pinterest's sandbox, not on real boards, until
# approved for Standard access -- see the README section on this.
[vars]
PINTEREST_SANDBOX = "false"
PINTEREST_BOARD_ID = ""

# Secrets (never put these in this file -- set them with `wrangler secret put`,
# or let scripts/setup.py set all of them for you in one step):
#   wrangler secret put PINTEREST_CLIENT_ID
#   wrangler secret put PINTEREST_CLIENT_SECRET
#   wrangler secret put PINTEREST_REFRESH_TOKEN
#   wrangler secret put MANUAL_TRIGGER_SECRET   (used only by the optional /run endpoint)
